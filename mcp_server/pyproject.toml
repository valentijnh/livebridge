[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "livebridge-mcp"
version = "0.1.0"
description = "MCP server that lets Claude control Ableton Live 12 through the LiveBridge Remote Script"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LiveBridge" }]
keywords = ["ableton", "live", "mcp", "music", "claude", "remote-script"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = ["mcp>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# live_audio_analyze (LUFS, spectrum, tempo, key of audio files); the server runs without it.
audio = ["numpy>=1.24", "scipy>=1.10", "soundfile>=0.12", "pyloudnorm>=0.1.1"]

[project.scripts]
livebridge-mcp = "livebridge_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/livebridge/livebridge"

[tool.setuptools.packages.find]
where = ["."]
include = ["livebridge_mcp*"]

[tool.setuptools.package-data]
livebridge_mcp = ["py.typed"]
