# Unit tests on the three desktop platforms. The suite needs no Ableton Live: it runs the
# Remote Script against the fake `Live` package in tests/live_stub. 3.11 is Live 12's own
# Python (the Remote Script), 3.10 the MCP server's minimum, 3.13 the newest.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
        include:
          - os: ubuntu-latest
            python: "3.10"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: mcp_server/pyproject.toml
      - name: Install the MCP server with test and audio extras
        run: python -m pip install -e "mcp_server[dev,audio]"
      - name: Run the test suite
        run: python -m pytest -q tests
